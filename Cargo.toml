[package]
name = "t3c"
version = "0.1.0"
edition = "2024"
description = "Search Things 3 titles, notes, and checklists"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
